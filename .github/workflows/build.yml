name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install libusb
        run: brew install libusb

      - name: Generate embedded cfg blob
        run: bash scripts/embed_cfgs.sh

      - name: Run tests
        run: swift test

      - name: Build universal DMG + standalone CLI
        run: bash scripts/package.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: RockchipDDRTestUtility
          path: RockchipDDRTestUtility.dmg

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: RockchipDDRTestUtilityCLI
          path: RockchipDDRTestUtilityCLI-macos.tar.gz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RockchipDDRTestUtility.dmg
            RockchipDDRTestUtilityCLI-macos.tar.gz
          generate_release_notes: true
